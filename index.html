<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install Flayer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .version {
            color: #666;
            margin-bottom: 30px;
        }
        .install-btn {
            display: inline-block;
            padding: 15px 40px;
            background: #007AFF;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .install-btn:hover {
            background: #0051D5;
        }
        .instructions {
            margin-top: 30px;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Flayer</h1>
        <p class="version">Version 2.1.8+1</p>
        <a href="itms-services://?action=download-manifest&url=https://mykyusuf.github.io/flayer_download/manifest.plist" class="install-btn">Install App</a>
        <p style="margin-top: 15px; font-size: 12px; color: #999;">If installation fails, try: <a href="itms-services://?action=download-manifest&url=https://github.com/mykyusuf/flayer/releases/download/v2.1.8+1/manifest.plist" style="color: #007AFF;">Alternative Link</a></p>
        <div class="instructions">
            <p><strong>Installation Instructions:</strong></p>
            <p>1. Tap "Install App" button</p>
            <p>2. Allow installation when prompted</p>
            <p>3. Go to Settings > General > VPN & Device Management</p>
            <p>4. Trust the developer certificate</p>
        </div>
    </div>
</body>
</html>
